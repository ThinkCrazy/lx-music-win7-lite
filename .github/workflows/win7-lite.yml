name: Win7 x86 Lite

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

env:
  IS_CI: 'true'
  BUILD_WIN7: 'true'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install locked build dependencies
        run: npm ci
      - name: Install frozen Win7 runtime dependencies
        run: npm install --no-save --package-lock=false electron@22.3.0 better-sqlite3@12.6.0 undici@5.28.4
      - name: Install native build tools
        run: python -m pip install setuptools
      - name: Build application
        run: npm run build
      - name: Package Win7 32-bit green build
        run: npm run pack:win7:7z:x86
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-win7-lite-x86
          path: build/*win7_x86-green.7z
          if-no-files-found: error
