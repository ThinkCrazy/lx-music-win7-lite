name: Win7 x86 Lite

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

env:
  IS_CI: 'true'
  BUILD_WIN7: 'true'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron-builder/Cache
          key: win7-x86-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: win7-x86-electron-
      - name: Install locked build dependencies
        run: npm ci
      - name: Install frozen Win7 runtime dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts electron@22.3.0 better-sqlite3@12.6.0 undici@5.28.4
      - name: Verify frozen Win7 runtime
        run: node build-config/verify-win7.js
      - name: Stage Win7 x86 SQLite binary
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP 'better_sqlite3_win32-ia32.node'
          Copy-Item 'build-config/lib/better_sqlite3_win32-ia32.node' $staged -Force
          "WIN7_SQLITE_BINARY=$staged" >> $env:GITHUB_ENV
      - name: Build application
        run: npm run build
      - name: Package Win7 32-bit green build
        run: npm run pack:win7:7z:x86
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-win7-lite-x86
          path: build/*win7_x86-green.7z
          if-no-files-found: error
